version: '3.8'

services:
  gmail-cleaner-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmail-cleaner-pro
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      # Persistent storage for SQLite database, session tokens, and credentials
      - ./data:/app/data
